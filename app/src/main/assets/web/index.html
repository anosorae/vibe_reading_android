<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#faf7f2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%239a6b3f'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23faf7f2' font-family='serif'%3E译%3C/text%3E%3C/svg%3E">
<title>译读 · Web 伴读</title>
<style>
  /* ── 设计令牌 ──
     色彩：五档背景继承 App ReaderBgPresets（跨设备一致是产品约束），
           --card/--border/--expand-bg 由 bgFamily() 按底色明暗派生，
           --accent 与四个章节状态色随预设深浅成套切换（见 JS BG_PRESETS）。
     字体：chrome = 无衬线工具层；display = 衬线标题（书名的文学性）；
           read = 用户选择的正文，只作用于正文与标题，不污染按钮/目录。
     排版：正文尺寸走 --fs/--lh，标题与标签用 em 相对缩放，形成单一 type scale；
           阅读栏宽按「每行多少字」表达（--measure-chars）。
     签名：双语对照 —— 可展开的段落靠指针形状与原生 title 提示，展开的另一种语言用
           Markdown 引用块样式（左侧细线 + 弱化文字色）与正文区分。 */
  :root {
    --bg: #faf7f2; --card: #fffdf8; --text: #2c2825; --muted: #6b635b;
    --border: #e5ddcc; --accent: #9a6b3f; --expand-bg: #efe9db; --quote-border: #d2cfca;
    --dot-done: #6a9955; --dot-failed: #c25b4e; --dot-toolong: #d09a3e;
    --font-chrome: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-display: Georgia, "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC", SimSun, serif;
    /* 数据面：只给数字用（进度百分比、已译/总数），等宽让同类数字上下对齐 */
    --font-data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-read: var(--font-chrome);
    --fs: 17px; --lh: 1.9; --measure-chars: 36;
    --header-h: 56px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--font-chrome); font-size: 16px;
    transition: background-color .2s ease, color .2s ease;
  }
  a { color: var(--accent); }
  button {
    font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px;
    cursor: pointer; transition: border-color .15s, color .15s, background-color .15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; pointer-events: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── 顶栏 ── */
  header {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 6px;
    padding: calc(9px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 9px calc(14px + env(safe-area-inset-left));
    background: var(--bg); /* 不支持 color-mix 的浏览器回退为不透明底色 */
    border-bottom: 1px solid var(--border);
    transition: transform .25s ease;
  }
  @supports (color: color-mix(in srgb, red, blue)) {
    header {
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
  }
  header.hide { transform: translateY(-100%); }
  header h1 {
    font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .01em;
  }
  #btn-settings { padding: 5px 10px; font-size: 13px; letter-spacing: .02em; }

  /* 显示语言分段控件：当前语言可见，而不是一个会翻转的按钮文案 */
  #mode-seg { display: none; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #mode-seg button {
    border: 0; border-radius: 0; padding: 5px 8px; font-size: 12px;
    background: transparent; color: var(--muted);
  }
  #mode-seg button:hover { color: var(--accent); }
  #mode-seg button.on { background: var(--expand-bg); color: var(--accent); font-weight: 700; }

  /* ── 阅读设置面板 ── */
  #settings-pop {
    position: fixed; top: calc(var(--header-h, 56px) + 6px); right: 12px; z-index: 45;
    width: min(320px, calc(100vw - 24px)); padding: 10px 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 14px 36px rgba(0, 0, 0, .16); display: none;
  }
  #settings-pop.open { display: block; }
  .pop-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .pop-row + .pop-row { border-top: 1px solid var(--border); }
  .pop-label { width: 3em; flex: none; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  #bg-picker { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  #bg-picker .dot {
    width: 18px; height: 18px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, .18); flex: none;
  }
  #bg-picker .dot[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  #font-picker {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 6px; cursor: pointer;
  }
  .stepper { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .stepper button { width: 32px; height: 30px; padding: 0; font-size: 15px; line-height: 1; }
  .stepper .val {
    min-width: 3.4em; text-align: center; font-size: 13px;
    font-variant-numeric: tabular-nums; color: var(--text);
  }

  /* ── 阅读页 ── */
  main {
    max-width: 42em; margin: 0 auto;
    padding: 20px calc(18px + env(safe-area-inset-left)) calc(88px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-right));
  }
  main.reader { max-width: calc(var(--measure-chars) * 1em); font-size: var(--fs); }

  .section-label {
    color: var(--muted); font-size: .78em; margin: 0 0 6px; letter-spacing: .1em;
    font-family: var(--font-read); text-indent: 0;
  }
  .chapter-title {
    font-family: var(--font-display); font-size: 1.34em; line-height: 1.35;
    font-weight: 700; margin: 0 0 12px; letter-spacing: .01em;
  }
  .chapter-rule { height: 1px; background: var(--border); margin: 0 0 26px; }

  p.para {
    margin: 0 0 1em; text-indent: 2em; text-align: justify;
    line-height: var(--lh); font-family: var(--font-read);
    -webkit-hyphens: auto; hyphens: auto;
    scroll-margin-top: calc(var(--header-h, 56px) + 12px);
  }
  /* 可展开的段落只留指针形状与原生 title 提示，不加底色（触屏靠首访提示说明可点按） */
  p.para.has-other { cursor: pointer; }

  /* 展开的另一种语言：Markdown 引用块样式——左侧细线 + 弱化文字色，不填底色 */
  .expand {
    margin: 0 0 1.15em; padding: 2px 0 2px 1em;
    border-left: 3px solid var(--quote-border);
    color: var(--muted);
    font-family: var(--font-read); font-size: .92em; line-height: var(--lh);
    text-align: justify; -webkit-hyphens: auto; hyphens: auto;
    animation: reveal .2s ease;
  }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }

  figure.illus { margin: 1.4em 0; text-align: center; }
  figure.illus img { display: block; margin: 0 auto; max-width: 100%; height: auto; border-radius: 8px; }

  .status-tip {
    margin: 22px 0 0; padding: 10px 12px; border-radius: 8px;
    background: var(--expand-bg); color: var(--muted);
    font-family: var(--font-chrome); font-size: .84em; line-height: 1.7;
  }
  .chapter-nav { display: flex; justify-content: space-between; margin-top: 36px; gap: 12px; }
  .chapter-nav button { flex: 1; }

  /* ── 书架 ──
     一栏正文 + 一栏带表头的「页边注」：阅读进度与已译章节数右对齐进页边栏，用等宽字体排
     （像书目卡上的编号），表头只印一次；英雄区不是卡片而是一个标题页，用同一套栏位，
     所以整页是同一张表——留白不是空着，是一栏有标签的数据。
     配色一律取自五档阅读底色派生的语义色，不额外引入色相：书架和阅读器必须像同一个产品。 */
  main.shelf {
    /* 一栏可读宽度：行宽跟着正文栏宽走（≈阅读器 36 字），否则每行被拉到千余像素，
       中间全是撑出来的空白。 */
    max-width: min(720px, 100%);
    padding-top: 14px;
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    /* 行左右内缩：英雄区与列表行共用同一个值，页边栏的数字才能逐列对齐 */
    --shelf-inset: 2px;
  }
  .cover-box {
    position: relative; width: 100%;
    border-radius: var(--cover-r, 10px); overflow: hidden;
    background: var(--expand-bg);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 8px 18px -10px rgba(0, 0, 0, .35);
  }
  /* 3:4 撑高：百分比 padding 以「自身宽度」为参照（所以必须由伪元素撑，
     不能在 .cover-box 上直接写 padding-top——那是按父元素宽度算的，
     固定宽度封面（英雄区/列表行）会被撑成整页高）。 */
  .cover-box::before { content: ''; display: block; padding-top: 133.333%; }
  @supports (aspect-ratio: 3 / 4) {
    .cover-box { aspect-ratio: 3 / 4; }
    .cover-box::before { display: none; }
  }
  .cover-box img.cv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 无封面：程序化「字母封面」——平色底 + accent 衬线首字（对齐 legado 默认封面的做法），
     不做标题重复，也不用渐变。 */
  .cover-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--expand-bg);
  }
  .cover-fallback .cf-t {
    font-family: var(--font-display); font-weight: 700; line-height: 1;
    font-size: var(--fb-fs, 26px); color: var(--accent);
  }

  /* 英雄区：标题页。大衬线书名占满正文栏，下面一行是「读到哪 + 页边数据」，再下面是行动 */
  .shelf-hero { padding: 2px 0 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .shelf-kicker { font-size: 10.5px; letter-spacing: .3em; color: var(--muted); }
  .shelf-title {
    font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.25;
    margin-top: 10px; letter-spacing: .01em;
  }
  .shelf-hero-foot {
    display: flex; align-items: flex-start; gap: 14px; margin-top: 15px;
    padding-right: var(--shelf-inset);   /* 与 .shelf-row 同栏位，数字列对齐 */
  }
  .shelf-hero .cover-box {
    width: 46px; flex: none; --cover-r: 4px; --fb-fs: 15px;
    box-shadow: none; outline: 1px solid var(--border); outline-offset: -1px;
  }
  .shelf-hero-col { flex: 1; min-width: 0; }
  /* 数字与「读到哪」按基线对齐，所以这里是 baseline 而不是 center */
  .shelf-ledger { display: flex; align-items: baseline; gap: 14px; }
  .shelf-ledger .where {
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .shelf-cta {
    display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 8px;
    background: var(--accent); color: var(--on-accent, #fff); font-size: 13px; font-weight: 600;
  }

  /* 表头：栏位宽度与每行、英雄区共用，表头只印一次 */
  .shelf-head {
    display: flex; align-items: baseline; gap: 14px;
    padding: 13px var(--shelf-inset) 7px;   /* 左右内缩同 .shelf-row，页边栏右边界才对齐 */
    border-bottom: 1px solid var(--border);
  }
  .shelf-head .t { flex: 1; font-size: 10.5px; letter-spacing: .3em; color: var(--muted); }
  .shelf-col { flex: none; font-size: 10.5px; letter-spacing: .18em; color: var(--muted); text-align: right; }
  .shelf-col.pct { width: 62px; }
  .shelf-col.cnt { width: 82px; }
  /* 页边栏的数字：等宽 + 右对齐 + 固定列宽，所以表头、英雄区、每一行都落在同一条竖线上 */
  .shelf-num {
    flex: none; font-family: var(--font-data); font-size: 12.5px;
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .shelf-num.pct { width: 62px; color: var(--text); }
  .shelf-num.cnt { width: 82px; color: var(--muted); }

  /* 列表行：封面 | 书名 + 读到哪 | 页边数据。行宽＝正文栏，不加卡片壳 */
  .shelf-row {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    padding: 11px var(--shelf-inset); border: 0; background: none; border-radius: 10px;
  }
  .shelf-row + .shelf-row { box-shadow: inset 0 1px 0 var(--border); }  /* 发丝分隔线，不动圆角 */
  .shelf-row:hover { background: var(--expand-bg); }
  /* 列表里封面小，投影会糊成一团，改用 1px 内描边勾边 */
  .shelf-row .cover-box {
    width: 42px; flex: none; --cover-r: 4px; --fb-fs: 14px;
    box-shadow: none; outline: 1px solid var(--border); outline-offset: -1px;
  }
  .shelf-row-body { flex: 1; min-width: 0; }
  .shelf-row .shelf-row-title {
    font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .shelf-row:hover .shelf-row-title { color: var(--accent); }
  .shelf-row-sub {
    font-size: 11.5px; color: var(--muted); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 窄屏：页边栏收窄，把宽度还给书名 */
  @media (max-width: 520px) {
    .shelf-head, .shelf-row, .shelf-ledger, .shelf-hero-foot { gap: 10px; }
    .shelf-col.pct, .shelf-num.pct { width: 46px; }
    .shelf-col.cnt, .shelf-num.cnt { width: 66px; }
  }

  /* ── 目录抽屉 ── */
  #catalog-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .38); display: none; z-index: 40; }
  #catalog {
    position: fixed; top: 0; right: 0; width: min(420px, 90vw);
    height: 100vh; height: 100dvh; z-index: 41;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    background: var(--card); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  #catalog.open { transform: translateX(0); }
  #catalog .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  #catalog .head .t { font-weight: 700; font-size: 15px; }
  #catalog .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  #catalog .legend span { display: flex; align-items: center; gap: 5px; }
  #catalog .list { overflow-y: auto; flex: 1; padding: 8px 8px 24px; overscroll-behavior: contain; }
  .ch-row {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .ch-row:hover { background: var(--expand-bg); }
  .ch-row.current { background: var(--expand-bg); font-weight: 700; }
  .ch-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-row .btn-translate { padding: 3px 10px; font-size: 12px; border-radius: 6px; flex: none; }

  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--border); }
  .dot.done { background: var(--dot-done); }
  .dot.doing { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .dot.failed { background: var(--dot-failed); }
  .dot.toolong { background: var(--dot-toolong); }
  @keyframes pulse { 50% { opacity: .35; } }

  .toast {
    position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(8px);
    max-width: min(88vw, 420px); text-align: center;
    background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: .94; transform: translateX(-50%) translateY(0); }
  .empty { text-align: center; color: var(--muted); padding: 56px 0; }
  .empty p { margin: 0 0 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<header>
  <button id="btn-back" style="display:none">书架</button>
  <h1 id="page-title">译读 · Web 伴读</h1>
  <div id="mode-seg" role="group" aria-label="显示语言">
    <button type="button" data-mode="zh">中</button>
    <button type="button" data-mode="en">EN</button>
  </div>
  <button id="btn-catalog" style="display:none" aria-expanded="false">目录</button>
  <button id="btn-settings" aria-expanded="false" aria-controls="settings-pop" title="阅读设置">Aa</button>
</header>

<div id="settings-pop" role="dialog" aria-label="阅读设置">
  <div class="pop-row"><span class="pop-label">背景</span><span id="bg-picker"></span></div>
  <div class="pop-row"><span class="pop-label">字体</span><select id="font-picker" aria-label="正文字体"></select></div>
  <div class="pop-row">
    <span class="pop-label">字号</span>
    <span class="stepper">
      <button type="button" id="fs-minus" aria-label="减小字号">−</button>
      <span class="val" id="fs-val"></span>
      <button type="button" id="fs-plus" aria-label="增大字号">＋</button>
    </span>
  </div>
  <div class="pop-row">
    <span class="pop-label">行距</span>
    <span class="stepper">
      <button type="button" id="lh-minus" aria-label="减小行距">−</button>
      <span class="val" id="lh-val"></span>
      <button type="button" id="lh-plus" aria-label="增大行距">＋</button>
    </span>
  </div>
</div>

<main id="main"><div class="empty">加载中…</div></main>

<div id="catalog-mask"></div>
<aside id="catalog" role="dialog" aria-modal="true" aria-label="章节目录" tabindex="-1">
  <div class="head">
    <div class="t" id="catalog-title">目录</div>
    <div class="legend">
      <span><i class="dot"></i>待译</span>
      <span><i class="dot doing"></i>翻译中</span>
      <span><i class="dot done"></i>已译</span>
      <span><i class="dot failed"></i>失败</span>
      <span><i class="dot toolong"></i>过长</span>
    </div>
  </div>
  <div class="list" id="catalog-list"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

// ── 存储：读写都必须容错。隐私模式/存储禁用时 setItem 会抛异常，
//    早期版本因此中断脚本、页面永久停在「加载中」——
//    所以首屏路径上的任何存储调用都不得让异常冒泡。
function lsGet(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : v; }
  catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
}

// ── Token：地址栏的 ?token= 优先，localStorage 作为「旧地址没带 token」时的兜底 ──
//    刻意不把 token 从地址栏抹掉：一旦抹掉，刷新、历史记录、地址栏自动补全、
//    以及「从地址栏复制地址」都会丢掉它，而本页所有请求都依赖它——用户只会
//    看到一句「缺少 Token」的死路，无从判断该做什么。
//    也不在这里因 token 为空而提前退出：服务端可能已用首次访问种下的 Cookie
//    授权（ADR-005 三通道），那种情况下页面应当照常工作。
if (location.protocol === 'file:') {
  document.body.innerHTML = '<div class="empty">你打开的是本地文件，不是手机上的伴读服务。' +
    '<br>请在手机 App「设置 → Web 伴读」里点一下那条地址复制（形如 http://192.168.x.x:9700/?token=…），粘贴到电脑浏览器打开。</div>';
  return;
}
const TOKEN = new URLSearchParams(location.search).get('token') || lsGet('companion_token', '');
if (TOKEN) lsSet('companion_token', TOKEN);

const $ = (id) => document.getElementById(id);
const main = $('main');
const header = document.querySelector('header');

/** 自增 div 的安全文本写入；错误信息一律走 textContent，不进 innerHTML。 */
function renderError(message, retry) {
  main.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'empty';
  const p = document.createElement('p');
  p.textContent = message;
  box.appendChild(p);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = '重试';
  btn.onclick = retry;
  box.appendChild(btn);
  main.appendChild(box);
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400);
}

function withToken(path) {
  if (!TOKEN) return path;  // 空 token 交给 Cookie 授权（首次带 token 访问时由服务端种下）
  return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
}
async function api(path, opts) {
  const res = await fetch(withToken(path), opts);
  const body = await res.json().catch(() => ({ ok: false, error: '响应解析失败' }));
  // 401 单独给可操作的说法：Token 每次开启服务都会重新生成，用户最容易卡在这里
  if (res.status === 401) {
    throw new Error('访问 Token 无效或已失效。Token 每次在手机上开启 Web 伴读都会重新生成，' +
      '请回到手机 App「设置 → Web 伴读」重新复制完整地址。');
  }
  if (!res.ok || !body.ok) throw new Error(body.error || ('HTTP ' + res.status));
  return body.data;
}
function post(path, data) {
  return api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}

/** canvas 测宽探测：候选字体与兜底字体测出的文本宽度不同 → 该字体已安装。 */
function probeLocalFonts() {
  const text = '译读阅读测试，字体探针abcABC123.;: fi';
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const bases = ['monospace', 'serif', 'sans-serif'];
  const baseW = bases.map(b => { ctx.font = '32px ' + b; return ctx.measureText(text).width; });
  const hits = [];
  PROBE_FONTS.forEach(f => {
    for (let i = 0; i < bases.length; i++) {
      ctx.font = '32px ' + f.css + ',' + bases[i];
      if (Math.abs(ctx.measureText(text).width - baseW[i]) > 0.5) { hits.push(f); break; }
    }
  });
  return hits;
}

/** 选中态：{k:'b', v:常用档下标} 或 {k:'c', n:显示名, css:font-family 候选串} */
let fontSel = (() => {
  const raw = lsGet('companion_font', '');
  if (raw && raw.charAt(0) === '{') {
    try { return JSON.parse(raw); } catch (e) { /* 损坏则回退默认 */ }
  }
  if (raw) return { k: 'b', v: parseInt(raw, 10) || 0 }; // 旧版格式
  return { k: 'b', v: 0 };
})();
function localFontCache() {
  try { return JSON.parse(lsGet('companion_font_families', '[]')) || []; }
  catch (e) { return []; }
}
function applyFont() {
  const root = document.documentElement.style;
  let stack = '';
  if (fontSel.k === 'c' && fontSel.css) stack = fontSel.css;
  else stack = (FONT_OPTIONS[fontSel.v] || FONT_OPTIONS[0]).stack;
  // 阅读字体只作用于正文与标题（CSS 里限定选择器），工具层固定无衬线
  if (stack) root.setProperty('--font-read', stack + ', var(--font-chrome)');
  else root.removeProperty('--font-read');
  lsSet('companion_font', JSON.stringify(fontSel));
}
function rebuildFontPicker() {
  const sel = $('font-picker');
  sel.innerHTML = '';
  FONT_OPTIONS.forEach((o, i) => {
    const op = document.createElement('option');
    op.value = JSON.stringify({ k: 'b', v: i });
    op.textContent = o.name;
    sel.appendChild(op);
  });
  const fams = localFontCache();
  if (fams.length) {
    const g = document.createElement('optgroup');
    g.label = '本机字体';
    fams.forEach(f => {
      const op = document.createElement('option');
      op.value = JSON.stringify({ k: 'c', n: f.n, css: f.css });
      op.textContent = f.n;
      g.appendChild(op);
    });
    sel.appendChild(g);
  }
  const scan = document.createElement('option');
  scan.value = SCAN_VALUE;
  scan.textContent = fams.length ? '⟳ 重新扫描本机字体…' : '扫描本机字体…';
  sel.appendChild(scan);
  sel.value = JSON.stringify(fontSel);
  // 记忆的字体不在列表里（如换了电脑）：追加为临时项避免下拉显示错位
  if (sel.value !== JSON.stringify(fontSel)) {
    const op = document.createElement('option');
    op.value = JSON.stringify(fontSel);
    op.textContent = (fontSel.k === 'c' ? fontSel.n : (FONT_OPTIONS[fontSel.v] || {}).name) || '系统默认';
    sel.insertBefore(op, sel.firstChild);
    sel.value = JSON.stringify(fontSel);
  }
}
function mergeFontCache(hits) {
  const cache = localFontCache();
  const seen = new Set(cache.map(f => f.n));
  hits.forEach(h => { if (!seen.has(h.n)) { cache.push(h); seen.add(h.n); } });
  lsSet('companion_font_families', JSON.stringify(cache));
}
function scanLocalFonts() {
  const hits = probeLocalFonts();
  mergeFontCache(hits);
  rebuildFontPicker();
  toast('探测到 ' + hits.length + ' 个已安装的常用字体，下拉即可选择');
}
function initFontPicker() {
  const sel = $('font-picker');
  sel.onchange = () => {
    if (sel.value === SCAN_VALUE) {
      scanLocalFonts();
      sel.value = JSON.stringify(fontSel);
      return;
    }
    try { fontSel = JSON.parse(sel.value); } catch (e) { fontSel = { k: 'b', v: 0 }; }
    applyFont();
  };
  rebuildFontPicker();
  applyFont();
}

// ── 背景预设（对齐 App ReaderBgPresets 五档与 ReaderPalette 正文色）──
// accent 与状态色成套定义：青绿档用绿强调、深夜档整体提亮，避免暗底上棕字对比不足。
// onAccent 是压在 accent 上的前景色（徽标、主按钮）——深夜档 accent 偏亮，须用深字。
const BG_PRESETS = [
  { name: '暖白', bg: '#faf7f2', text: '#2c2825', muted: '#6b635b', accent: '#9a6b3f', onAccent: '#fff' },
  { name: '米色', bg: '#f5f0e8', text: '#2c2825', muted: '#6b635b', accent: '#8d6238', onAccent: '#fff' },
  { name: '青绿', bg: '#f0f4ee', text: '#2c2825', muted: '#5f6b5c', accent: '#4f7a5a', onAccent: '#fff' },
  { name: '灰米', bg: '#eeece8', text: '#2c2825', muted: '#6b635b', accent: '#7d6a55', onAccent: '#fff' },
  { name: '深夜', bg: '#2c2825', text: 'rgba(250,247,242,.92)', muted: '#b8afa3', accent: '#c99a6a', onAccent: '#2c2825' }
];
const STATUS_LIGHT = { done: '#6a9955', failed: '#c25b4e', toolong: '#d09a3e' };
const STATUS_DARK = { done: '#8fbf78', failed: '#e0857a', toolong: '#e0b256' };

function isDarkHex(hex) {
  return (parseInt(hex.slice(1), 16) & 255) < 128;
}
// 由 bg 派生的配套色：卡片微亮、边框/展开块微暗（深夜档反向微亮）；
// quoteBorder 是引用块左侧那道线的颜色，比 --border 更实一点才看得见。
function bgFamily(hex) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const dark = isDarkHex(hex);
  const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  const fmt = (d) => '#' + rgb.map(v => clamp(v + d).toString(16).padStart(2, '0')).join('');
  return {
    card: fmt(dark ? 6 : 4),
    border: fmt(dark ? 10 : -12),
    expandBg: fmt(dark ? 14 : -22),
    quoteBorder: fmt(dark ? 30 : -40)
  };
}

// 首次访问跟随系统深色偏好，而不是无条件给最亮的一档
let bgIndex = (() => {
  const stored = lsGet('companion_bg', '');
  if (stored === '') {
    return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 4 : 0;
  }
  const n = parseInt(stored, 10);
  return (n >= 0 && n < BG_PRESETS.length) ? n : 0;
})();
function applyBg() {
  const p = BG_PRESETS[bgIndex], fam = bgFamily(p.bg), st = isDarkHex(p.bg) ? STATUS_DARK : STATUS_LIGHT;
  const root = document.documentElement.style;
  root.setProperty('--bg', p.bg);
  root.setProperty('--card', fam.card);
  root.setProperty('--border', fam.border);
  root.setProperty('--expand-bg', fam.expandBg);
  root.setProperty('--quote-border', fam.quoteBorder);
  root.setProperty('--text', p.text);
  root.setProperty('--muted', p.muted);
  root.setProperty('--accent', p.accent);
  root.setProperty('--on-accent', p.onAccent || '#fff');
  root.setProperty('--dot-done', st.done);
  root.setProperty('--dot-failed', st.failed);
  root.setProperty('--dot-toolong', st.toolong);
  const meta = $('meta-theme');
  if (meta) meta.setAttribute('content', p.bg);  // 移动端浏览器 UI 跟随阅读底色
  lsSet('companion_bg', String(bgIndex));
  document.querySelectorAll('#bg-picker .dot').forEach((d, i) =>
    d.setAttribute('aria-pressed', i === bgIndex ? 'true' : 'false'));
}
function initBgPicker() {
  const picker = $('bg-picker');
  BG_PRESETS.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.style.background = p.bg;
    b.title = p.name;
    b.setAttribute('aria-label', '背景：' + p.name);
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => { bgIndex = i; applyBg(); };
    picker.appendChild(b);
  });
  applyBg();
}

// ── 字号 / 行距（阅读场景最刚需的两项，此前只能靠系统缩放）──
const FS_MIN = 14, FS_MAX = 24, LH_MIN = 1.5, LH_MAX = 2.4;
let fsPx = Math.min(FS_MAX, Math.max(FS_MIN, parseInt(lsGet('companion_fs', '17'), 10) || 17));
let lhVal = Math.min(LH_MAX, Math.max(LH_MIN, parseFloat(lsGet('companion_lh', '1.9')) || 1.9));
function applyType() {
  const root = document.documentElement.style;
  root.setProperty('--fs', fsPx + 'px');
  root.setProperty('--lh', String(+lhVal.toFixed(2)));
  $('fs-val').textContent = fsPx + 'px';
  $('lh-val').textContent = lhVal.toFixed(1);
  $('fs-minus').disabled = fsPx <= FS_MIN;
  $('fs-plus').disabled = fsPx >= FS_MAX;
  $('lh-minus').disabled = lhVal <= LH_MIN + 1e-9;
  $('lh-plus').disabled = lhVal >= LH_MAX - 1e-9;
  lsSet('companion_fs', String(fsPx));
  lsSet('companion_lh', String(lhVal));
}
function initTypeControls() {
  $('fs-minus').onclick = () => { fsPx = Math.max(FS_MIN, fsPx - 1); applyType(); };
  $('fs-plus').onclick = () => { fsPx = Math.min(FS_MAX, fsPx + 1); applyType(); };
  $('lh-minus').onclick = () => { lhVal = Math.max(LH_MIN, +(lhVal - 0.1).toFixed(2)); applyType(); };
  $('lh-plus').onclick = () => { lhVal = Math.min(LH_MAX, +(lhVal + 0.1).toFixed(2)); applyType(); };
  applyType();
}

let settingsOpen = false;

// ── 状态 ──
const ST = { PENDING: 0, IN_PROGRESS: 1, DONE: 2, FAILED: -1, TOO_LONG: 3 };
const STATUS_TEXT = { 0: '待译', 1: '翻译中', 2: '已译', '-1': '翻译失败', 3: '超出长度上限' };
const STATUS_CLASS = { 0: '', 1: 'doing', 2: 'done', '-1': 'failed', 3: 'toolong' };

const state = {
  view: 'shelf',            // shelf | reader
  book: null,               // 当前书（含 languageMode/sourceLanguage）
  chapters: [],             // 目录缓存
  chapterId: null,
  content: null,            // 当前章正文
  restoredBookId: null,     // 已恢复过手机进度的书；避免同书内二次进入被再次拉走
  catalogOpen: false,
  pollTimer: null,
  pollUntil: 0,             // 宽限期内即使没有在译章节也不停表（刚触发翻译、DB 还没翻状态）
  saveTimer: null,
  hasOtherSide: false
};

// ── 双语插槽（与 App ReadingParagraph.chineseSide/englishSide 同语义）──
// 主侧缺失时回退原文（对齐 App「en 模式无译文回退单语」语义）
function sidesOf(p, book) {
  const zh = book.sourceLanguage === 'en' ? (p.trans || null) : (p.src || null);
  const en = book.sourceLanguage === 'en' ? (p.src || null) : (p.trans || null);
  const pick = (mainSide, other) => ({ main: mainSide || other, other: mainSide ? other : null });
  // zh 模式下展开的是英文侧，它只有在英文才是原文时才算原文（en 模式反之）
  return book.languageMode === 'en'
    ? Object.assign(pick(en, zh), { otherIsSource: book.sourceLanguage === 'zh' })
    : Object.assign(pick(zh, en), { otherIsSource: book.sourceLanguage === 'en' });
}
/**
 * 另一侧的元信息：是原文还是译文、以及它的语言。
 * 两者都不再显示成可见标签（展开块只留引用样式），语言只落到 lang 属性上，
 * 用于断词与读屏发音——信息不丢，但不占视觉。
 */
function otherSideMeta(book, otherIsSource) {
  const src = book.sourceLanguage === 'en' ? 'en' : 'zh';
  return {
    role: otherIsSource ? '原文' : '译文',
    lang: otherIsSource ? src : (src === 'en' ? 'zh' : 'en')
  };
}

// ── 路由 ──
function parseHash() {
  const m = location.hash.match(/^#\/book\/(\d+)(?:\/(\d+))?$/);
  return m ? { bookId: +m[1], chapterId: m[2] ? +m[2] : null } : null;
}
window.addEventListener('hashchange', route);

async function route() {
  stopPolling();
  closeSettings();
  closeCatalog();
  const r = parseHash();
  if (!r) {
    state.view = 'shelf';
    state.book = null; state.chapters = []; state.content = null; state.chapterId = null;
    state.restoredBookId = null;   // 回到书架后再进同一本书，仍应恢复手机进度
    renderShelf();
    return;
  }
  state.view = 'reader';
  state.chapterId = r.chapterId;
  try {
    // 打开书但未指定章节时必须重拉：拿最新的手机进度（lastReadChapterId/Offset）
    if (!state.book || state.book.id !== r.bookId || !r.chapterId) {
      const list = await api('/api/books/' + r.bookId + '/chapters');
      state.book = list.book;
      state.chapters = list.chapters;
    }
    if (!r.chapterId) {
      // 无章节号：优先恢复手机进度，否则首章
      const target = state.book.lastReadChapterId || (state.chapters[0] && state.chapters[0].id);
      if (!target) { renderError('这本书还没有章节。', route); return; }
      location.replace('#/book/' + r.bookId + '/' + target);
      return;
    }
    renderReaderShell();
    // 每本书只在首次进入时恢复手机进度；之后再从目录进同一章应当从章首开始
    const restore = (state.restoredBookId !== r.bookId && r.chapterId === state.book.lastReadChapterId)
      ? state.book.lastReadOffset : undefined;
    state.restoredBookId = r.bookId;
    await loadChapter(state.chapterId, restore);
    refreshCatalog();
    ensurePolling();
    maybeShowExpandHint();
  } catch (e) {
    renderError(e.message, route);
  }
}

// ── 书架 ──
// 一栏正文 + 一栏带表头的「页边注」（设计定稿；曾经比较过的其它版式已删除）。
// 数据源：/api/books（别名 → 进度摘要 + 封面 URL）。
async function renderShelf() {
  $('btn-back').style.display = 'none';
  $('btn-catalog').style.display = 'none';
  $('mode-seg').style.display = 'none';
  $('page-title').textContent = '译读 · Web 伴读';
  main.classList.remove('reader');
  main.classList.add('shelf');
  main.removeAttribute('lang');
  main.innerHTML = '<div class="empty">加载中…</div>';
  let books;
  try {
    books = await api('/api/books');
  } catch (e) {
    renderError(e.message, () => renderShelf());
    return;
  }
  main.innerHTML = '';
  if (!books.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '书架还是空的，先在手机 App 里导入书籍吧。';
    main.appendChild(e);
    return;
  }
  const byRecent = books.slice().sort((a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0));
  const hero = byRecent.find(b => b.lastReadChapterId) || byRecent[0];
  main.appendChild(buildShelfHero(hero));
  const rest = books.filter(b => b !== hero);
  if (!rest.length) return;
  main.appendChild(buildShelfHead(rest.length));
  const list = document.createElement('div');
  rest.forEach(b => list.appendChild(buildShelfRow(b)));
  main.appendChild(list);
}

// ── 书架通用构件 ──
/** 3:4 封面盒：有封面用封面，无封面用「字母封面」。 */
function coverNode(b) {
  const box = document.createElement('div');
  box.className = 'cover-box';
  if (b.hasCover) {
    const img = document.createElement('img');
    img.className = 'cv';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.alt = b.title + ' 封面';
    img.onerror = () => img.replaceWith(fallbackCover(b));
    img.src = withToken('/cover/' + b.id);
    box.appendChild(img);
  } else {
    box.appendChild(fallbackCover(b));
  }
  return box;
}
/** 无封面时的程序化封面：平色底 + 衬线首字（不做标题重复，标题位置另有安排）。 */
function fallbackCover(b) {
  const fb = document.createElement('div');
  fb.className = 'cover-fallback';
  fb.setAttribute('role', 'img');
  fb.setAttribute('aria-label', b.title + ' 封面');
  const t = document.createElement('span');
  t.className = 'cf-t';
  t.textContent = monogram(b.title);
  fb.appendChild(t);
  return fb;
}
function monogram(title) {
  const s = (title || '').replace(/^[\s《「『【（(〈\["']+/, '');
  return s.charAt(0) || '书';
}
function readPct(b) { return Math.round((b.progress || 0) * 100); }
function shelfAria(b) {
  return b.title + '，' + (b.lastReadChapterTitle ? '读到 ' + b.lastReadChapterTitle : '未开始阅读')
    + '，阅读进度 ' + readPct(b) + '%，已译 ' + b.translatedCount + '/' + b.totalChapters + ' 章';
}
function bookButton(cls, b) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = cls;
  el.setAttribute('aria-label', shelfAria(b));
  el.onclick = () => { location.hash = '#/book/' + b.id; };
  return el;
}
/** 整块可点的英雄区：div + role=button（里面要放块级内容，不能用 button 套 div），回车/空格同样可开。 */
function clickable(cls, b) {
  const el = document.createElement('div');
  el.className = cls;
  el.setAttribute('role', 'button');
  el.tabIndex = 0;
  el.setAttribute('aria-label', shelfAria(b));
  el.onclick = () => { location.hash = '#/book/' + b.id; };
  el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); el.click(); }
  });
  return el;
}
/** 页边栏的一格数据（等宽、右对齐、固定列宽）。kind 决定列宽与颜色：pct | cnt */
function shelfNum(kind, text) {
  const s = document.createElement('span');
  s.className = 'shelf-num ' + kind;
  s.textContent = text;
  return s;
}
function whereLine(text) {
  const s = document.createElement('span');
  s.className = 'where';
  s.textContent = text;
  return s;
}

/** 英雄区：标题页。大书名 + 一行「读到哪 + 页边数据」+ 行动；栏位与列表行完全共用。 */
function buildShelfHero(b) {
  const wrap = clickable('shelf-hero', b);
  const kicker = document.createElement('div');
  kicker.className = 'shelf-kicker';
  kicker.textContent = b.lastReadChapterId ? '最近在读' : '尚未开始';
  const title = document.createElement('div');
  title.className = 'shelf-title';
  title.textContent = b.title;

  const foot = document.createElement('div');
  foot.className = 'shelf-hero-foot';
  foot.appendChild(coverNode(b));
  const col = document.createElement('div');
  col.className = 'shelf-hero-col';
  const ledger = document.createElement('div');
  ledger.className = 'shelf-ledger';
  ledger.append(
    whereLine(b.lastReadChapterTitle ? '读到 ' + b.lastReadChapterTitle
      : (b.format === 'epub' ? 'EPUB' : 'TXT') + ' · 共 ' + b.totalChapters + ' 章'),
    shelfNum('pct', readPct(b) + '%'),
    shelfNum('cnt', b.translatedCount + '/' + b.totalChapters));
  const cta = document.createElement('span');
  cta.className = 'shelf-cta';
  cta.textContent = b.lastReadChapterId ? '继续阅读 →' : '开始阅读 →';
  col.append(ledger, cta);
  foot.appendChild(col);
  wrap.append(kicker, title, foot);
  return wrap;
}

/** 表头：只印一次栏位名。栏名是纯视觉对齐用，逐行的 aria-label 已含完整信息，故对读屏隐藏。 */
function buildShelfHead(n) {
  const head = document.createElement('div');
  head.className = 'shelf-head';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = '全部书籍 · ' + n;
  const p = document.createElement('span');
  p.className = 'shelf-col pct';
  p.textContent = '进度';
  const c = document.createElement('span');
  c.className = 'shelf-col cnt';
  c.textContent = '已译';
  p.setAttribute('aria-hidden', 'true');
  c.setAttribute('aria-hidden', 'true');
  head.append(t, p, c);
  return head;
}

function buildShelfRow(b) {
  const row = bookButton('shelf-row', b);
  row.appendChild(coverNode(b));
  const body = document.createElement('div');
  body.className = 'shelf-row-body';
  const title = document.createElement('div');
  title.className = 'shelf-row-title';
  title.textContent = b.title;
  const sub = document.createElement('div');
  sub.className = 'shelf-row-sub';
  sub.textContent = b.lastReadChapterTitle ? '读到 ' + b.lastReadChapterTitle : '未开始阅读';
  body.append(title, sub);
  row.append(body, shelfNum('pct', readPct(b) + '%'), shelfNum('cnt', b.translatedCount + '/' + b.totalChapters));
  return row;
}

// ── 阅读页 ──
function renderReaderShell() {
  $('btn-back').style.display = '';
  $('btn-catalog').style.display = '';
  $('mode-seg').style.display = 'flex';
  $('page-title').textContent = state.book.title;
  $('catalog-title').textContent = state.book.title + ' · 目录';
  main.classList.remove('shelf');
  main.classList.add('reader');
  syncModeSeg();
  main.innerHTML = '<div class="empty">加载中…</div>';
}

/** 分段控件的选中态＝当前显示语言；同时给内容区打上 lang（影响断词与读屏发音）。 */
function syncModeSeg() {
  const mode = state.book.languageMode === 'en' ? 'en' : 'zh';
  document.querySelectorAll('#mode-seg button').forEach(b => {
    const on = b.dataset.mode === mode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  main.setAttribute('lang', mode === 'en' ? 'en' : 'zh-CN');
}

/**
 * restoreOffset：
 *   数字 → 恢复到该 offset 所在段落；
 *   undefined → 新章节，回到章首；
 *   null → 内容原地重载（如译文完成），保持当前滚动位置，避免读者被弹回顶部。
 */
async function loadChapter(chapterId, restoreOffset) {
  state.chapterId = chapterId;
  const keepY = restoreOffset === null ? window.scrollY : null;
  try {
    state.content = await api('/api/chapters/' + chapterId + '?bookId=' + state.book.id);
  } catch (e) {
    state.content = null;
    renderError(e.message, () => loadChapter(chapterId, restoreOffset));
    return;
  }
  renderContent();
  if (keepY !== null) window.scrollTo({ top: keepY });
  else if (restoreOffset != null) scrollToOffset(restoreOffset);
  else window.scrollTo({ top: 0 });
}

function renderContent() {
  const c = state.content, book = state.book;
  main.innerHTML = '';
  if (c.section) {
    const s = document.createElement('p');
    s.className = 'section-label';
    s.textContent = c.section;
    main.appendChild(s);
  }
  const h = document.createElement('h2');
  h.className = 'chapter-title';
  h.textContent = c.title;
  main.appendChild(h);
  const rule = document.createElement('div');
  rule.className = 'chapter-rule';
  rule.setAttribute('aria-hidden', 'true');
  main.appendChild(rule);

  let hasOtherSide = false;
  c.paragraphs.forEach(p => {
    if (p.type === 'img') {
      main.appendChild(buildIllustration(p, c.title));
      return;
    }
    const sides = sidesOf(p, book);
    if (!sides.main) return; // en 模式译文未就绪：回退原文，两侧都空则跳过
    const el = document.createElement('p');
    el.className = 'para';
    el.textContent = sides.main;
    el.dataset.start = p.start;
    el.dataset.end = p.end;
    if (sides.other) {
      hasOtherSide = true;
      const other = otherSideMeta(book, sides.otherIsSource);
      el.classList.add('has-other');
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', '0');
      el.setAttribute('aria-expanded', 'false');
      el.title = '点击展开' + other.role;
      const toggle = () => toggleExpand(el, sides.other, other.lang);
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); }
      });
    }
    main.appendChild(el);
  });
  state.hasOtherSide = hasOtherSide;

  if (!main.querySelector('p.para') && !main.querySelector('figure.illus')) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '本章暂无正文。';
    main.appendChild(e);
  }
  if (c.status === ST.TOO_LONG || c.status === ST.FAILED) {
    const tip = document.createElement('div');
    tip.className = 'status-tip';
    tip.textContent = (c.status === ST.TOO_LONG ? '本章超出翻译长度上限：' : '本章翻译失败：') + (c.errorMessage || '');
    main.appendChild(tip);
  }

  const idx = state.chapters.findIndex(x => x.id === state.chapterId);
  const nav = document.createElement('div');
  nav.className = 'chapter-nav';
  nav.setAttribute('aria-label', '章节导航');
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '← 上一章';
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = '下一章 →';
  prev.disabled = idx <= 0;
  next.disabled = idx < 0 || idx >= state.chapters.length - 1;
  prev.onclick = () => goChapter(idx - 1);
  next.onclick = () => goChapter(idx + 1);
  nav.append(prev, next);
  main.appendChild(nav);
}

function buildIllustration(p, chapterTitle) {
  const fig = document.createElement('figure');
  fig.className = 'illus';
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = chapterTitle + ' 插图';
  // 后端导入期已解码出宽高：写进属性让浏览器预留空间，
  // 否则懒加载图片会在 scrollToOffset 之后撑高页面，恢复的进度整体偏上。
  if (p.imgW) {
    img.width = p.imgW;
    img.style.maxWidth = 'min(100%, ' + Math.min(p.imgW, 720) + 'px)';
  }
  if (p.imgH) img.height = p.imgH;
  img.onerror = () => fig.remove();  // 缺图时不要留一个破图占位
  img.src = withToken(p.imgUrl);
  fig.appendChild(img);
  return fig;
}

function toggleExpand(paraEl, text, lang) {
  const next = paraEl.nextElementSibling;
  if (next && next.classList.contains('expand')) {
    next.remove();
    paraEl.setAttribute('aria-expanded', 'false');
    return;
  }
  const box = document.createElement('div');
  box.className = 'expand';
  if (lang) box.setAttribute('lang', lang === 'en' ? 'en' : 'zh-CN');
  box.textContent = text;
  paraEl.after(box);
  paraEl.setAttribute('aria-expanded', 'true');
}

/** 首次进入阅读页给一次提示：段落可点按展开另一种语言，触屏没有 hover 可依赖。 */
function maybeShowExpandHint() {
  if (!state.hasOtherSide) return;
  if (lsGet('companion_hint_expand', '') === '1') return;
  lsSet('companion_hint_expand', '1');
  setTimeout(() => toast('点击段落可展开另一种语言'), 1000);
}

function goChapter(idx) {
  const ch = state.chapters[idx];
  if (!ch) return;
  flushProgress();  // 切章前把当前位置写回，否则最后一段阅读会丢
  location.hash = '#/book/' + state.book.id + '/' + ch.id;
}

// ── 进度：定位 + 防抖回写（视口顶部段落的 startOffset）──
function scrollToOffset(offset) {
  const paras = [...main.querySelectorAll('p.para')];
  const target = paras.find(el => {
    const s = +el.dataset.start, e = +el.dataset.end;
    return s >= 0 && offset >= s && offset < e;
  }) || paras.find(el => +el.dataset.start >= 0 && +el.dataset.end > offset)
     || paras[0];
  if (target) target.scrollIntoView({ block: 'start' });
}

/** 顶栏下沿以下、最靠上的段落即为「顶部可见段」；滚过全部段落则取最后一段。 */
function topVisibleOffset() {
  const limit = headerH() - 1;
  const paras = main.querySelectorAll('p.para');
  let lastStart = null;
  for (const el of paras) {
    const s = +el.dataset.start;
    if (s >= 0) lastStart = s;
    if (el.getBoundingClientRect().bottom >= limit) return s >= 0 ? s : lastStart;
  }
  return lastStart;
}

function progressPayload() {
  if (state.view !== 'reader' || !state.book || !state.chapterId) return null;
  const offset = topVisibleOffset();
  if (offset == null) return null;
  return { bookId: state.book.id, chapterId: state.chapterId, offset };
}

let progressWarned = false;
function writeProgress() {
  const payload = progressPayload();
  if (!payload) return;
  post('/api/progress', payload)
    .then(() => { progressWarned = false; })
    .catch(e => {
      if (!progressWarned) {
        progressWarned = true;
        toast('阅读进度暂未同步到手机，下次滚动会重试');
      }
      console.warn('进度回写失败', e);
    });
}

/** 离开页面/切章时立即落一次，兜住防抖窗口内的最后一段阅读。 */
function flushProgress() {
  const payload = progressPayload();
  if (!payload) return;
  clearTimeout(state.saveTimer);
  const body = JSON.stringify(payload);
  try {
    if (navigator.sendBeacon && navigator.sendBeacon(withToken('/api/progress'), new Blob([body], { type: 'application/json' }))) return;
  } catch (e) { /* 回退到 keepalive fetch */ }
  try {
    fetch(withToken('/api/progress'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body, keepalive: true
    });
  } catch (e) { /* 页面正在卸载，失败无补救手段 */ }
}

// ── 顶栏自动隐藏：下滑隐藏，上滑或回到页顶浮现 ──
let lastScrollY = 0;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (y < 60 || y < lastScrollY - 4) header.classList.remove('hide');
  else if (y > lastScrollY + 4) { header.classList.add('hide'); closeSettings(); }
  lastScrollY = y;

  if (state.view !== 'reader' || !state.content) return;
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(writeProgress, 1500);
}, { passive: true });

// ── 目录 ──
function refreshCatalog() {
  const list = $('catalog-list');
  const keep = list.scrollTop;   // 轮询刷新不应把正在翻目录的读者弹回顶部
  list.innerHTML = '';
  state.chapters.forEach((ch, i) => {
    const row = document.createElement('div');
    row.className = 'ch-row' + (ch.id === state.chapterId ? ' current' : '');
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    if (ch.id === state.chapterId) row.setAttribute('aria-current', 'true');

    const dot = document.createElement('span');
    dot.className = 'dot ' + (STATUS_CLASS[ch.status] || '');
    dot.title = STATUS_TEXT[ch.status] || '';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = (i + 1) + '. ' + ch.title;
    name.title = ch.errorMessage || '';

    const sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = STATUS_TEXT[ch.status] || '';

    row.append(dot, sr, name);
    if (ch.status === ST.PENDING || ch.status === ST.FAILED || ch.status === ST.TOO_LONG) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-translate';
      btn.textContent = ch.status === ST.PENDING ? '翻译' : '重译';
      btn.setAttribute('aria-label', btn.textContent + '：' + ch.title);
      btn.onclick = (ev) => { ev.stopPropagation(); triggerTranslate(ch); };
      row.appendChild(btn);
    }
    const open = () => { closeCatalog(); goChapter(i); };
    row.onclick = open;
    row.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
    list.appendChild(row);
  });
  list.scrollTop = keep;
}

function openCatalog() {
  state.catalogOpen = true;
  closeSettings();
  $('catalog').classList.add('open');
  $('catalog').setAttribute('aria-hidden', 'false');
  $('catalog-mask').style.display = 'block';
  $('btn-catalog').setAttribute('aria-expanded', 'true');
  // 抽屉是模态：正文与顶栏都要退出可交互/可读范围
  main.setAttribute('aria-hidden', 'true');
  header.setAttribute('aria-hidden', 'true');
  if ('inert' in main) { main.inert = true; header.inert = true; }
  refreshCatalog();
  const list = $('catalog-list');
  const cur = list.querySelector('.ch-row.current');
  if (cur) list.scrollTop = Math.max(0, cur.offsetTop - list.clientHeight / 2);  // 长目录里定位当前章
  $('catalog').focus();
}
function closeCatalog() {
  if (!state.catalogOpen) return;
  state.catalogOpen = false;
  $('catalog').classList.remove('open');
  $('catalog-mask').style.display = 'none';
  $('btn-catalog').setAttribute('aria-expanded', 'false');
  main.removeAttribute('aria-hidden');
  header.removeAttribute('aria-hidden');
  if ('inert' in main) { main.inert = false; header.inert = false; }
}
function initCatalog() {
  $('btn-catalog').onclick = () => { if (state.catalogOpen) closeCatalog(); else openCatalog(); };
  $('catalog-mask').onclick = closeCatalog;
}

async function triggerTranslate(ch) {
  try {
    const r = await post('/api/chapters/' + ch.id + '/translate?bookId=' + state.book.id, {});
    if (r.error) toast(r.error);
    else if (r.alreadyRunning) toast('该章正在翻译中');
    else toast('已开始翻译「' + ch.title + '」');
    await refreshChapterList();
    if (state.catalogOpen) refreshCatalog();
    startPolling(20000);  // 宽限 20s：DB 状态翻成 IN_PROGRESS 之前的几拍不要停表
  } catch (e) {
    toast(e.message);
  }
}

// ── 状态轮询（ADR-005）：只在有章节在译时轮询，且只查在译的那几章 ──
// 空闲（无 IN_PROGRESS）时不产生任何请求；切回标签页时补一次全量同步，
// 以便接住「在手机上触发的翻译」。
async function refreshChapterList() {
  const list = await api('/api/books/' + state.book.id + '/chapters');
  const changed = JSON.stringify(list.chapters) !== JSON.stringify(state.chapters);
  state.book = list.book;
  state.chapters = list.chapters;
  return changed;
}

async function reloadCurrentIfDone() {
  const cur = state.chapters.find(c => c.id === state.chapterId);
  if (cur && cur.status === ST.DONE && state.content && state.content.status !== ST.DONE) {
    // 原地重载并保持读到的位置；anchor 取不到时 loadChapter 会保持 scrollY
    await loadChapter(state.chapterId, topVisibleOffset());
  }
}

async function pollTick() {
  if (state.view !== 'reader' || document.hidden || !state.book) return;
  const active = state.chapters.filter(c => c.status === ST.IN_PROGRESS);
  if (!active.length) {
    if (Date.now() >= state.pollUntil) stopPolling();
    return;
  }
  let changed = false;
  for (const c of active) {
    try {
      const st = await api('/api/chapters/' + c.id + '/status?bookId=' + state.book.id);
      const i = state.chapters.findIndex(x => x.id === c.id);
      if (i >= 0 && (state.chapters[i].status !== st.status || state.chapters[i].errorMessage !== st.errorMessage)) {
        state.chapters[i] = st;
        changed = true;
      }
    } catch (e) { /* 单章状态查询失败：静默，下个周期重试 */ }
  }
  if (changed) {
    if (state.catalogOpen) refreshCatalog();
    await reloadCurrentIfDone();
  }
  if (!state.chapters.some(c => c.status === ST.IN_PROGRESS) && Date.now() >= state.pollUntil) stopPolling();
}

function startPolling(graceMs) {
  if (graceMs) state.pollUntil = Date.now() + graceMs;
  if (!state.pollTimer) state.pollTimer = setInterval(pollTick, 4000);
}
function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}
/** 只有确实有章节在译时才开表；空闲的阅读页不产生任何轮询流量。 */
function ensurePolling() {
  const active = state.chapters.some(c => c.status === ST.IN_PROGRESS)
    || !!(state.content && state.content.status === ST.IN_PROGRESS);
  if (active) startPolling();
  else if (Date.now() >= state.pollUntil) stopPolling();
}
/** 切回标签页：全量同步一次（接住手机端触发的翻译），再按需恢复轮询。 */
async function resumeFromHidden() {
  if (state.view !== 'reader' || !state.book) return;
  try { await refreshChapterList(); } catch (e) { return; }
  if (state.catalogOpen) refreshCatalog();
  await reloadCurrentIfDone();
  ensurePolling();
}

// ── 交互绑定 ──
$('btn-back').onclick = () => { flushProgress(); location.hash = '#/'; };
document.querySelectorAll('#mode-seg button').forEach(btn => {
  btn.onclick = async () => {
    const next = btn.dataset.mode;
    if (!state.book || state.book.languageMode === next) return;
    try {
      await post('/api/books/' + state.book.id + '/mode', { mode: next });
      state.book.languageMode = next;
      const anchor = topVisibleOffset();   // 换语言整章重排，按同一段落重新锚定
      syncModeSeg();
      renderContent();
      refreshCatalog();
      if (anchor != null) scrollToOffset(anchor);
    } catch (e) { toast(e.message); }
  };
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') {
    if (state.catalogOpen) { closeCatalog(); $('btn-catalog').focus(); return; }
    if (settingsOpen) { closeSettings(); return; }
  }
  const tag = ev.target && ev.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (state.view !== 'reader' || state.catalogOpen || !state.book) return;
  const idx = state.chapters.findIndex(x => x.id === state.chapterId);
  if (ev.key === 'ArrowLeft' && idx > 0) goChapter(idx - 1);
  if (ev.key === 'ArrowRight' && idx >= 0 && idx < state.chapters.length - 1) goChapter(idx + 1);
});

window.addEventListener('pagehide', flushProgress);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flushProgress(); stopPolling(); }
  else resumeFromHidden();
});
window.addEventListener('resize', syncHeaderHeight);

// ── 启动 ──
initBgPicker();
initFontPicker();
initTypeControls();
initSettingsPop();
initCatalog();
syncHeaderHeight();
route();

})();
</script>
</body>
</html>
